# Copy this file to config.yaml (git-ignored) and edit it for THIS machine.
# Every machine running mediavault has its own config.yaml with its own local
# paths — only this example file and the code are shared through git.

machine: my-mac-mini

# Where mediavault keeps its own index/state for this machine.
# Keep this outside any synced folder — it is per-machine, not shared.
db_path: ~/.local/share/mediavault/mediavault.db

# Which hashing algorithm to use for content comparison.
# "blake3" is much faster if the optional `blake3` package is installed;
# falls back to sha256 automatically otherwise.
hash_algo: blake3

# Set this env var to your TMDB v3 API key (https://www.themoviedb.org/settings/api)
# to enable automatic title/year lookups. Never put the key itself in this file.
tmdb_api_key_env: TMDB_API_KEY

# File extensions considered "media" when scanning inbox/suggestion folders.
video_extensions: [".mkv", ".mp4", ".m4v", ".avi", ".mov", ".wmv", ".ts"]

# How often the background worker rescans all roots, recomputes duplicates/
# sync status, and fires notifications when something changes. Runs while
# `mediavault web` / `mediavault gui` is up; a full rescan also always runs
# once at startup so the local index is fresh before you look at anything.
scan_interval_minutes: 15

# Opt-in: lets this machine find and pair with other mediavault instances on
# your network (same LAN via mDNS, or anywhere on your Tailscale tailnet) so
# Protection's cross-machine catalog exchange can happen automatically
# instead of moving a JSON file by hand. Off by default because it starts a
# second, small server reachable from your network (not just 127.0.0.1) —
# see the Peers section in the UI, and src/mediavault/peer_api.py for
# exactly what that server does and doesn't expose. Nothing is ever shared
# with another machine until you explicitly pair with it (a code confirmed
# on both sides), regardless of this setting.
enable_lan_discovery: false

# Port for the peer-to-peer service above. Only used when
# enable_lan_discovery is true. Change it if 8421 is already taken on this
# machine, or if you're running two instances on one machine (see the
# `peer_port` used in tests for an example).
peer_port: 8421

# Folders themselves are NOT configured here — they're live state kept in
# this machine's SQLite index (db_path above) so you can add, edit, or
# remove them from the CLI or the web/desktop UI without editing YAML or
# restarting anything. See `mediavault root --help`, or the Roots section
# in the UI (its "Browse…" button opens a native folder picker).
#
# Exactly one root should be role=primary — that's the single basis every
# other mirror/subset root is compared against automatically under the Sync
# section. There's no manual pairing to set up.
#
# The `roots:` block below is optional and only used ONCE, the first time
# `mediavault init` runs on a fresh machine, to seed its index. Delete it (or
# leave it out) once you're managing roots through the UI/CLI instead.
#
# role:
#   primary  - the single basis: a full, authoritative copy of your library
#   backup   - another full copy meant to mirror the primary
#   icloud   - a folder backed by iCloud Drive (or similar) that may only
#              hold a SUBSET of files locally at any time (placeholders for
#              the rest). Never treated as a deletion source.
#   inbox    - a folder to watch for untracked media worth adding to the
#              library (e.g. Downloads), not part of sync.
#
# mode:
#   mirror  - full two-way backup; a file missing on one side is a candidate
#             to copy across (or, if it used to exist, a candidate deletion
#             you must confirm explicitly).
#   subset  - this root intentionally only has some files. Missing files are
#             never treated as deletions and nothing is ever deleted here
#             automatically.
#   watch   - not synced at all, just scanned for suggestions/duplicates.
roots:
  - label: primary-library
    path: /Volumes/Media/Movies
    role: primary
    mode: mirror

  - label: backup-drive
    path: /Volumes/Backup/Movies
    role: backup
    mode: mirror

  - label: icloud-movies
    path: ~/Library/Mobile Documents/com~apple~CloudDocs/Movies
    role: icloud
    mode: subset

  - label: downloads-inbox
    path: ~/Downloads
    role: inbox
    mode: watch
