<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MediaVault{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav class="topnav">
    <a class="brand" href="/">MediaVault</a>
    <a href="#roots">Roots</a>
    <a href="#sync">Sync</a>
    <a href="#protection">Protection</a>
    {% if dup_groups %}<a href="#duplicates">Duplicates</a>{% endif %}
    {% if untracked_count %}<a href="#suggestions">Suggestions</a>{% endif %}
    <a href="#icloud">iCloud Storage</a>
    <a href="#recycle-bin">Recycle Bin</a>
    {% if metadata_files %}<a href="#metadata">Metadata</a>{% endif %}
  </nav>
  <main>
    {% if msg %}<div class="flash">{{ msg }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
