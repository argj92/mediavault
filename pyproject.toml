[project]
name = "mediavault"
version = "0.1.0"
description = "Personal movie/TV library manager: cross-machine folder sync, metadata enrichment, duplicate detection, and iCloud-aware storage management."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "guessit>=3.8",
]

[project.optional-dependencies]
gui = ["pywebview>=5.0"]
fast-hash = ["blake3>=0.4"]
dev = ["pytest>=8.0"]

[project.scripts]
mediavault = "mediavault.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mediavault = ["web/templates/*.html", "web/static/*.css"]
